name: Run Compose Redis Counter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      # Installed as an Action so GitHub fetches the client through its
      # authenticated action-download path rather than a runner curl request.
      - name: Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2
      - name: Launch Compose stack and public tunnel
        shell: bash
        run: |
          set -euo pipefail
          cd compose-counter
          docker compose up --build -d
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/healthz
          # Cloudflare quick tunnels are more stable than the free SSH tunnel
          # previously used here.  cloudflared comes from the setup Action.
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8000 \
            >/tmp/tunnel.log 2>&1 &
          for _ in {1..60}; do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/tunnel.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          test -n "${URL:-}"
          cd ..
          printf '%s\n' "$URL" > compose-counter-tunnel.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compose-counter-tunnel.txt
          git commit -m 'Publish counter tunnel URL' || true
          git push
          echo "Public tunnel: $URL"
          # Keep the parent shell alive: hosted runners clean up background
          # processes when a step ends, so this must stay in this same step.
          sleep 21000
