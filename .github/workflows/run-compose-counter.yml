name: Run Compose Redis Counter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Launch Compose stack and public tunnel
        shell: bash
        run: |
          set -euo pipefail
          cd compose-counter
          docker compose up --build -d
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/healthz
          # localhost.run is an SSH reverse tunnel; it needs no local daemon or
          # package installation on the ephemeral GitHub runner.
          nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes -R 80:localhost:8000 \
            nokey@localhost.run >/tmp/tunnel.log 2>&1 &
          for _ in {1..60}; do
            URL=$(grep -oE 'https://[a-z0-9.-]+' /tmp/tunnel.log | grep -v localhost.run | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          test -n "${URL:-}"
          curl --fail --silent "$URL/healthz"
          cd ..
          printf '%s\n' "$URL" > compose-counter-tunnel.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compose-counter-tunnel.txt
          git commit -m 'Publish counter tunnel URL' || true
          git push
          echo "Public tunnel: $URL"
      - name: Keep tunnel online for grading
        run: sleep 21000
